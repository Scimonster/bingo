name: Test and deploy on push to main
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:emulators
  build_and_deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGO_5717E }}
          channelId: live
          projectId: bingo-5717e
  # Backend (Functions, Firestore/Storage rules, indexes and TTL policies). Opt in by setting the
  # repository variable DEPLOY_BACKEND=true once the service account has the roles needed
  # (Cloud Functions Admin, Service Account User, Firebase Rules Admin, Cloud Datastore Index Admin).
  deploy_backend:
    needs: test
    if: ${{ vars.DEPLOY_BACKEND == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGO_5717E }}' > "$RUNNER_TEMP/sa.json"
      - run: pnpm exec firebase deploy --only functions,firestore,storage --project bingo-5717e --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
