name: Test and deploy on push to main
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:emulators
  # Firestore/Storage rules, Firestore indexes and TTL policies. Runs before hosting so a new
  # client never goes live against rules that don't know about it. Service account roles needed:
  # Firebase Rules Admin, Cloud Datastore Index Admin, Firebase Storage Admin.
  deploy_rules:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGO_5717E }}
      - run: pnpm exec firebase deploy --only firestore,storage --project bingo-5717e --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
  build_and_deploy:
    needs: deploy_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGO_5717E }}
          channelId: live
          projectId: bingo-5717e
  # Cloud Functions. Opt in by setting the repository variable DEPLOY_BACKEND=true once the
  # service account has the roles needed (Cloud Functions Admin, Service Account User).
  deploy_functions:
    needs: test
    if: ${{ vars.DEPLOY_BACKEND == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGO_5717E }}
      - run: pnpm exec firebase deploy --only functions --project bingo-5717e --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
